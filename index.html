        <style>
          html, body { background: #070912; }
          #launch-shell { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; overflow: hidden; color: #baf6ff; background: radial-gradient(circle at center, #152e53, #050813 58%); transition: opacity .45s ease; }
          #launch-shell::before { content: ''; position: absolute; width: 150px; height: 150px; border: 1px solid rgba(131, 235, 255, .62); transform: rotate(45deg); box-shadow: 0 0 36px rgba(73, 215, 255, .38), inset 0 0 35px rgba(112, 93, 255, .32); animation: launch-mark 2.45s ease-in forwards; }
          #launch-shell svg { position: relative; width: 64px; height: 64px; fill: currentColor; filter: drop-shadow(0 0 13px #6cecff); animation: launch-logo 2.45s ease-in forwards; }
          #launch-shell span { position: absolute; top: calc(50% + 112px); color: #eefcff; font: 700 24px/1 sans-serif; letter-spacing: .2em; animation: launch-copy 2.45s ease-in forwards; }
          #launch-shell span b { color: #82eaff; font-weight: inherit; }
          @keyframes launch-mark { 0%, 70% { opacity: 1; } 85% { box-shadow: 0 0 90px 25px rgba(90, 224, 255, .65); } 100% { opacity: 0; transform: rotate(45deg) scale(2.8); } }
          @keyframes launch-logo { 0% { opacity: 0; transform: scale(.4); } 25% { opacity: 1; transform: scale(1); } 82% { opacity: 1; } 100% { opacity: 0; transform: scale(2.2); } }
          @keyframes launch-copy { 0%, 78% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
        </style>
